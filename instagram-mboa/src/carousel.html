<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carrousels</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 1080px; }
  .slide {
    --k: 1;
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: radial-gradient(130% 80% at 85% 0%, #16204A 0%, var(--ink) 60%);
    padding: 80px 88px 92px; display: flex; flex-direction: column;
  }
  .slide > * { position: relative; z-index: 2; }
  .slide > .ndop, .slide > .grain, .slide > .vignette, .slide > .bigseven { position: absolute; z-index: 1; }
  .slide > .grain { z-index: 50; }

  header, footer {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-weight: 500; font-size: 23px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--mute);
  }
  header .brand { display: flex; align-items: center; gap: 16px; }
  header .brand i { width: 14px; height: 14px; background: var(--gold); display: block; transform: rotate(45deg); }
  footer { text-transform: none; letter-spacing: 0.04em; }
  footer .next { color: var(--paper); display: flex; align-items: center; gap: 12px; }
  footer .next b { color: var(--gold); font-weight: 700; }
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(243,241,236,0.08); z-index: 3; }
  .progress span { display: block; height: 100%; background: var(--gold); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; min-height: 0; }

  .eyebrow { font-family: var(--mono); font-weight: 700; font-size: 25px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  h1 { font-weight: 800; font-size: 128px; line-height: 0.98; letter-spacing: -0.04em; text-wrap: balance; }
  h1 em, h2 em { font-size: 1.1em; line-height: 0.8; letter-spacing: -0.01em; }
  h2 { font-weight: 800; font-size: calc(100px * var(--k)); line-height: 1.0; letter-spacing: -0.035em; text-wrap: balance; }
  .sub { font-size: 38px; line-height: 1.38; color: var(--mute); max-width: 860px; text-wrap: pretty; }
  .body { font-size: calc(40px * var(--k)); line-height: 1.42; color: rgba(243,241,236,0.86); text-wrap: pretty; }
  .kicker { display: flex; flex-direction: column; gap: 22px; font-weight: 700; font-size: calc(44px * var(--k)); line-height: 1.22; color: var(--gold); letter-spacing: -0.015em; text-wrap: balance; }
  .kicker::before { content: ""; width: 64px; height: 6px; background: var(--gold); display: block; }

  /* Couverture */
  .cover main { justify-content: flex-end; gap: 36px; padding-bottom: 40px; }
  .cover .ndop { -webkit-mask-image: radial-gradient(70% 60% at 100% 0%, #000 0%, transparent 100%); opacity: 0.11; }
  .bigseven { right: 130px; top: 30px; font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 760px; line-height: 1; letter-spacing: -0.05em; }
  .visual { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; }
  .tiles div { background: rgba(18,26,59,0.85); border: 2px solid var(--line); border-radius: 22px; padding: 26px 26px 30px; display: flex; flex-direction: column; gap: 14px; min-height: 200px; }
  .tiles div:nth-child(1) { border-color: var(--gold); }
  .tiles b { font-family: var(--mono); font-size: 22px; color: var(--gold); letter-spacing: 0.1em; }
  .tiles span { font-size: 36px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; }

  .tl { width: 100%; }
  .tl .ticks, .tl .labels { display: flex; font-family: var(--mono); font-size: 23px; color: var(--mute); letter-spacing: 0.06em; }
  .tl .bar { display: flex; height: 170px; gap: 6px; margin: 18px 0 22px; position: relative; }
  .tl .bar div { border-radius: 14px; background: var(--ink-3); border: 2px solid var(--line); }
  .tl .bar div.hot { background: var(--gold); border-color: var(--gold); }
  .tl .labels span { font-weight: 700; color: var(--paper); text-transform: uppercase; font-size: 21px; }
  .tl .labels span.hot { color: var(--gold); }
  .tl .playhead { position: absolute; top: -26px; bottom: -26px; width: 4px; background: var(--paper); left: 6.5%; border-radius: 4px; }
  .tl .playhead::before { content: ""; position: absolute; top: -14px; left: -10px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); }

  .week { display: flex; flex-direction: column; gap: 34px; width: 100%; }
  .week .wrow { display: flex; justify-content: space-between; }
  .week .d { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .week .d span { font-family: var(--mono); font-weight: 700; font-size: 26px; color: var(--mute); }
  .week .d i { width: 112px; height: 112px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; }
  .week .d i svg { width: 54px; height: 54px; }
  .week .cap { font-family: var(--mono); font-size: 24px; color: var(--mute); letter-spacing: 0.1em; text-transform: uppercase; display: flex; justify-content: space-between; border-top: 2px solid var(--line); padding-top: 26px; }
  .week .cap b { color: var(--gold); }

  /* Items */
  .item main { justify-content: flex-start; padding-top: 40px; gap: 40px; }
  .item .rows { flex: 1; justify-content: center; }
  .measuring .item .rows { flex: none; }
  .item .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .item .num { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 190px; line-height: 0.8; letter-spacing: -0.03em; }
  .item .num small { font-family: var(--mono); font-style: normal; font-size: 26px; color: var(--mute); letter-spacing: 0.1em; margin-left: 22px; vertical-align: top; }
  .tag { font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: 0.06em; color: var(--ink); background: var(--gold); padding: 14px 24px; border-radius: 999px; white-space: nowrap; margin-top: 10px; }
  .item h2 { font-size: 96px; margin-top: -6px; }
  .statement main { gap: calc(44px * var(--k)); }
  .rows { display: flex; flex-direction: column; gap: calc(40px * var(--k)); }
  .row { display: flex; flex-direction: column; gap: 16px; }
  .lbl { font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }
  .formula { font-family: var(--mono); font-weight: 500; font-size: calc(35px * var(--k)); line-height: 1.45; background: rgba(18,26,59,0.9); border: 2px solid var(--line); border-radius: 22px; padding: 30px 36px; color: var(--paper); }
  .quote { font-family: var(--serif); font-style: italic; font-size: calc(58px * var(--k)); line-height: 1.12; color: var(--paper); letter-spacing: -0.005em; text-wrap: pretty; }
  .quote::before { content: "« "; color: var(--gold); }
  .quote::after { content: " »"; color: var(--gold); }
  .quote.noq::before, .quote.noq::after { content: none; }
  .rbody { font-size: calc(38px * var(--k)); line-height: 1.4; color: rgba(243,241,236,0.86); text-wrap: pretty; }
  .tip { font-size: calc(36px * var(--k)); line-height: 1.4; background: rgba(242,183,5,0.1); border: 2px solid rgba(242,183,5,0.45); border-radius: 22px; padding: 28px 34px; color: var(--paper); }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 12px; }
  .chips .c { display: inline-flex; align-items: center; gap: 12px; }
  .chips .c > span { font-size: calc(31px * var(--k)); font-weight: 600; border: 2px solid var(--line); background: rgba(18,26,59,0.9); border-radius: 999px; padding: 14px 26px; }
  .chips i { font-style: normal; color: var(--gold); font-size: 34px; font-weight: 700; }

  /* Checklist / listes */
  .list { display: flex; flex-direction: column; }
  .list div { display: flex; align-items: flex-start; gap: 30px; padding: 30px 0; border-bottom: 2px solid var(--line); font-size: 42px; line-height: 1.28; font-weight: 600; letter-spacing: -0.01em; }
  .list div:first-child { border-top: 2px solid var(--line); }
  .list .box { flex: none; width: 56px; height: 56px; border-radius: 14px; border: 3px solid var(--gold); display: grid; place-items: center; margin-top: -2px; }
  .list .box svg { width: 34px; height: 34px; }
  .list .arrow { flex: none; color: var(--gold); font-weight: 800; width: 44px; }
  .list .dot { flex: none; width: 18px; height: 18px; background: var(--gold); transform: rotate(45deg); margin: 16px 12px 0 8px; }
  .note { font-size: 34px; line-height: 1.4; color: var(--mute); text-wrap: pretty; }
  .lead { font-size: 40px; line-height: 1.38; color: rgba(243,241,236,0.86); }

  /* Planning */
  .sched { display: flex; flex-direction: column; }
  .sched div { display: grid; grid-template-columns: 250px 1fr; align-items: baseline; padding: 30px 0; border-bottom: 2px solid var(--line); }
  .sched div:first-child { border-top: 2px solid var(--line); }
  .sched b { font-family: var(--mono); font-weight: 700; font-size: 30px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; }
  .sched span { font-size: 44px; font-weight: 700; letter-spacing: -0.015em; }

  /* Vue d'ensemble (anatomie) */
  .ov { display: flex; flex-direction: column; }
  .ov div { display: grid; grid-template-columns: 210px 1fr; align-items: baseline; gap: 10px; padding: 26px 0; border-bottom: 2px solid var(--line); }
  .ov div:first-child { border-top: 2px solid var(--line); }
  .ov b { font-family: var(--mono); font-weight: 700; font-size: 28px; color: var(--gold); }
  .ov span { font-size: 50px; font-weight: 800; letter-spacing: -0.02em; }
  .ov span small { font-size: 34px; font-weight: 500; color: var(--mute); letter-spacing: 0; margin-left: 14px; }

  /* Avertissement */
  .warn { align-self: flex-start; font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper); background: var(--red); padding: 14px 24px; border-radius: 999px; }

  /* CTA */
  .cta main { gap: 40px; }
  .acts { display: flex; flex-direction: column; gap: 30px; }
  .acts div { display: flex; align-items: center; gap: 32px; font-size: 39px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
  .acts i { flex: none; width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--gold); display: grid; place-items: center; }
  .acts i svg { width: 44px; height: 44px; }
  .prompt { background: var(--gold); color: var(--ink); border-radius: 26px; padding: 34px 40px; display: flex; flex-direction: column; gap: 14px; }
  .prompt b { font-family: var(--mono); font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; }
  .prompt span { font-size: 40px; line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; }
</style>
</head>
<body>
<div id="root"></div>
<script src="carousels.js"></script>
<script>
const qh = new URLSearchParams(location.search).get("handle");
if (qh) window.HANDLE = qh;
const ICON = {
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M21.5 2.5 10.5 13.5"/><path d="M21.5 2.5 14.5 21.5l-4-8-8-4z"/></svg>',
  follow: '<svg viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="7.5" r="4"/><path d="M2 21v-.5A6.5 6.5 0 0 1 8.5 14h1a6.5 6.5 0 0 1 6.5 6.5v.5"/><path d="M19.5 8v6M16.5 11h6"/></svg>',
  check: (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
};

// Typographie française : espaces insécables avant ? ! : ; » et après «, milliers, unités.
function fr(s) {
  return s
    .replace(/ ([?!:;»])/g, " $1")
    .replace(/« /g, "« ")
    .replace(/(\d) (\d{3})/g, "$1 $2")
    .replace(/(\d) (h|s|min|FCFA|%|jours|vidéos|abonnés)\b/g, "$1 $2")
    .replace(/ (→|–) /g, " $1 ");
}
function fmt(s) {
  return fr(s)
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]/g, '<span class="slot">[$1]</span>');
}

function frame(c, i, n, cls, inner, extra = "") {
  const last = i === n - 1;
  const left = window.HANDLE ? window.HANDLE : c.series;
  return `<section class="slide ${cls}" data-file="${c.id}/${String(i + 1).padStart(2, "0")}.png">
    ${extra}<div class="ndop"></div><div class="vignette"></div><div class="grain"></div>
    <header><div class="brand"><i></i>${fr(c.label)}</div><div>${String(i + 1).padStart(2, "0")} / ${String(n).padStart(2, "0")}</div></header>
    <main>${inner}</main>
    <footer><div>${fr(left)}</div>${last ? "<div></div>" : `<div class="next">${i === 0 ? "Glisse" : "Suite"} <b>→</b></div>`}</footer>
    <div class="progress"><span style="width:${((i + 1) / n) * 100}%"></span></div>
  </section>`;
}

function coverVisual(v) {
  if (v === "tiles") {
    const names = ["Le vrai prix", "Avant / Après", "Les coulisses", "Mythe vs réalité", "Je teste pour toi", "La question client"];
    return `<div class="visual"><div class="tiles">${names.map((n, k) => `<div><b>0${k + 1}</b><span>${fr(n)}</span></div>`).join("")}</div></div>`;
  }
  if (v === "timeline") {
    const seg = [["Hook", 3, true], ["Problème", 7], ["Preuve", 10], ["Offre", 7], ["Appel", 3]];
    const ticks = [0, 3, 10, 20, 27, 30];
    return `<div class="visual"><div class="tl">
      <div class="ticks">${seg.map((s, k) => `<span style="flex:${s[1]}">${ticks[k]}s</span>`).join("")}<span style="width:0;white-space:nowrap;transform:translateX(-100%)">30s</span></div>
      <div class="bar">${seg.map((s) => `<div class="${s[2] ? "hot" : ""}" style="flex:${s[1]}"></div>`).join("")}<span class="playhead"></span></div>
      <div class="labels">${seg.map((s) => `<span class="${s[2] ? "hot" : ""}" style="flex:${s[1]}">${s[1] >= 3 ? s[0] : ""}</span>`).join("")}</div>
    </div></div>`;
  }
  if (v === "week") {
    const d = ["L", "M", "M", "J", "V", "S", "D"];
    return `<div class="visual"><div class="week">
      <div class="wrow">${d.map((x) => `<div class="d"><i>${ICON.check("#0A0F24")}</i><span>${x}</span></div>`).join("")}</div>
      <div class="cap"><span>Cette semaine</span><b>7 / 7 vidéos publiées</b></div>
    </div></div>`;
  }
  return "";
}

function render(c) {
  const n = c.slides.length;
  return c.slides.map((s, i) => {
    switch (s.type) {
      case "cover":
        return frame(c, i, n, "cover", `
          ${s.visual !== "seven" ? coverVisual(s.visual) : ""}
          <div class="eyebrow">${fr(s.eyebrow)}</div>
          <h1>${fmt(s.title)}</h1>
          <p class="sub">${fmt(s.sub)}</p>`,
          s.visual === "seven" ? '<div class="bigseven">7</div>' : "");
      case "statement":
        return frame(c, i, n, "statement", `
          ${s.tone === "warning" ? '<div class="warn">Attention</div>' : ""}
          <h2>${fmt(s.title)}</h2>
          <p class="body">${fmt(s.body)}</p>
          <div class="kicker">${fmt(s.kicker)}</div>`);
      case "item":
        return frame(c, i, n, "item", `
          <div class="top"><div class="num">${String(s.index).padStart(2, "0")}<small>/ ${String(s.total).padStart(2, "0")}</small></div>${s.tag ? `<div class="tag">${fr(s.tag)}</div>` : ""}</div>
          <h2>${fmt(s.name)}</h2>
          <div class="rows">${s.rows.map((r) => `<div class="row"><div class="lbl">${fr(r.label)}</div>${
            r.style === "chips"
              ? `<div class="chips">${r.text.map((t, k) => `<span class="c"><span>${fr(t)}</span>${k < r.text.length - 1 ? "<i>→</i>" : ""}</span>`).join("")}</div>`
              : `<div class="${r.style === "body" ? "rbody" : r.style}${r.style === "quote" && r.text.startsWith("«") ? " noq" : ""}">${fmt(r.text)}</div>`
          }</div>`).join("")}</div>`);
      case "checklist": {
        const b = s.bullets || "check";
        const mark = b === "check" ? `<span class="box">${ICON.check("#F2B705")}</span>` : b === "arrow" ? '<span class="arrow">→</span>' : '<span class="dot"></span>';
        return frame(c, i, n, "checklist", `
          <h2>${fmt(s.title)}</h2>
          ${s.lead ? `<p class="lead">${fmt(s.lead)}</p>` : ""}
          <div class="list">${s.items.map((t) => `<div>${mark}<span>${fmt(t)}</span></div>`).join("")}</div>
          ${s.note ? `<p class="note">${fmt(s.note)}</p>` : ""}`);
      }
      case "schedule":
        return frame(c, i, n, "schedule", `
          <h2>${fmt(s.title)}</h2>
          <div class="sched">${s.rows.map((r) => `<div><b>${fr(r[0])}</b><span>${fr(r[1])}</span></div>`).join("")}</div>
          <p class="note">${fmt(s.note)}</p>`);
      case "overview": {
        const L = [["0–3 s", "Hook", "arrêter le pouce"], ["3–10 s", "Problème", "« c'est moi »"], ["10–20 s", "Preuve", "rendre crédible"], ["20–27 s", "Offre", "quoi acheter"], ["27–30 s", "Appel", "quoi faire"]];
        return frame(c, i, n, "overview", `
          <h2>${fmt(s.title)}</h2>
          <div class="ov">${L.map((l) => `<div><b>${fr(l[0])}</b><span>${l[1]}<small>${fr(l[2])}</small></span></div>`).join("")}</div>
          <p class="note">${fmt(s.body)}</p>`);
      }
      case "cta":
        return frame(c, i, n, "cta", `
          <h2>${fmt(s.title)}</h2>
          <div class="acts">${s.actions.map((a) => `<div><i>${ICON[a.icon]}</i><span>${fmt(a.text)}</span></div>`).join("")}</div>
          <div class="prompt"><b>En commentaire</b><span>${fmt(s.prompt)}</span></div>`);
    }
  }).join("");
}

document.getElementById("root").innerHTML = window.CAROUSELS.map(render).join("");

// Ajustement automatique : agrandit le texte des slides "item" (même facteur pour tout le carrousel)
// et des "statement" (par slide) tant que tout tient dans le cadre.
function span(m) {
  const r = [...m.children].map((c) => c.getBoundingClientRect());
  return Math.max(...r.map((x) => x.bottom)) - Math.min(...r.map((x) => x.top));
}
function maxK(slide, cap) {
  const m = slide.querySelector("main");
  let k = 1;
  while (k < cap) {
    slide.style.setProperty("--k", (k + 0.02).toFixed(2));
    if (span(m) > m.clientHeight - 110) break;
    k += 0.02;
  }
  slide.style.setProperty("--k", k.toFixed(2));
  return k;
}
document.fonts.ready.then(() => {
  document.body.classList.add("measuring");
  const groups = {};
  document.querySelectorAll(".slide.item").forEach((s) => {
    const c = s.dataset.file.split("/")[0];
    (groups[c] = groups[c] || []).push(s);
  });
  Object.values(groups).forEach((slides) => {
    const k = Math.min(...slides.map((s) => maxK(s, 1.32)));
    slides.forEach((s) => s.style.setProperty("--k", k.toFixed(2)));
  });
  document.querySelectorAll(".slide.statement").forEach((s) => maxK(s, 1.25));
  document.body.classList.remove("measuring");
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
