<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couvertures</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 1080px; }
  /* Couverture de Reel 1080×1920. Tout le texte reste dans la zone 3:4 centrale
     (y 240 → 1680) que la grille du profil affiche. */
  .cv {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background: radial-gradient(120% 60% at 90% 10%, #18235A 0%, var(--ink) 62%);
  }
  .cv .ndop { -webkit-mask-image: radial-gradient(80% 50% at 100% 0%, #000 0%, transparent 100%); opacity: 0.12; }
  .cv .in { position: absolute; left: 100px; right: 100px; top: 300px; bottom: 300px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; }
  .cv .top { display: flex; justify-content: space-between; align-items: center; }
  .cv .num { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 230px; line-height: 0.8; letter-spacing: -0.03em; }
  .cv .num small { font-family: var(--mono); font-style: normal; font-size: 30px; color: var(--mute); letter-spacing: 0.1em; margin-left: 20px; vertical-align: top; }
  .cv .tag { font-family: var(--mono); font-weight: 700; font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: var(--gold); padding: 16px 28px; border-radius: 999px; }
  .cv h1 { font-weight: 800; font-size: 150px; line-height: 0.98; letter-spacing: -0.045em; text-wrap: balance; }
  .cv h1 em { font-size: 1.1em; line-height: 0.8; }
  .cv .foot { font-family: var(--mono); font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: 18px; }
  .cv .foot i { width: 16px; height: 16px; background: var(--gold); transform: rotate(45deg); display: block; }

  /* Couvertures des stories à la une : lues dans un cercle au centre */
  .hl { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: var(--ink); display: grid; place-items: center; }
  .hl .disc { width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #1F2C66, #0E1534 70%); display: grid; place-items: center; position: relative; z-index: 2; }
  .hl svg { width: 330px; height: 330px; }
  .hl .word { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 300px; line-height: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const REELS = [
  [1, "Hooks · Partie 1", "Ta vidéo a *3 secondes* pour survivre"],
  [3, "Contenu", "Arrête de filmer *ton produit.*"],
  [4, "Jeudi business", "Où sont passés *les call-box* ?"],
  [6, "Vente", "Le client qui écrit *« Prix ? »*"],
  [7, "Système", "30 idées de vidéos *en 20 minutes*"],
  [8, "Hooks · Partie 2", "5 hooks *sans dire un mot*"],
  [10, "Avant / Après", "Même téléphone. *Autre vidéo.*"],
  [11, "Jeudi business", "Pourquoi le Kamer vend *sur WhatsApp*"],
  [13, "Vente", "3 phrases qui *tuent tes ventes*"],
  [14, "Bilan", "14 jours, 14 posts : *mes chiffres*"],
];
const HL = [
  ["commence-ici", '<svg viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="1.4" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"/></svg>'],
  ["hooks", '<span class="word">3s</span>'],
  ["avant-apres", '<svg viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 3v18"/><path d="M15 12h3M16.5 10.5 18 12l-1.5 1.5" stroke-linecap="round"/></svg>'],
  ["avis", '<svg viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>'],
  ["contact", '<svg viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="1.4" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5" stroke-linecap="round"/></svg>'],
];
function fr(s) {
  return s.replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ").replace(/(\d) (h|s|min|jours|posts)\b/g, "$1 $2");
}
const em = (s) => fr(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const handle = new URLSearchParams(location.search).get("handle") || "";
document.getElementById("root").innerHTML =
  REELS.map(([d, tag, title]) => `
  <section class="cv" data-file="reels/cover-j${String(d).padStart(2, "0")}.png">
    <div class="ndop"></div><div class="vignette"></div><div class="grain"></div>
    <div class="in">
      <div class="top"><div class="num">${String(d).padStart(2, "0")}<small>/ 14</small></div><div class="tag">${fr(tag)}</div></div>
      <h1>${em(title)}</h1>
      <div class="foot"><i></i>${handle || "14 jours pour vendre avec la vidéo"}</div>
    </div>
  </section>`).join("") +
  HL.map(([name, icon]) => `
  <section class="hl" data-file="highlights/${name}.png">
    <div class="ndop" style="opacity:.06"></div>
    <div class="disc">${icon}</div>
  </section>`).join("");
document.body.dataset.ready = "1";
</script>
</body>
</html>
